services:
  web:
    image: ghcr.io/yogianggara129/intervai-web:sha-b5e3200db2e0dec64392e14fdceeebfc4f5c6850
    container_name: intervai-web
    restart: unless-stopped
    environment:
      - VITE_BASE_URL
    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.http.routers.intervai-web.rule=Host(`${INTERVAI_HOST}`)
      - traefik.http.routers.intervai-web.entrypoints=web
      - traefik.http.routers.intervai-web.service=intervai-web
      - traefik.http.services.intervai-web.loadbalancer.server.port=8043

  api:
    image: ghcr.io/yogianggara129/intervai-api:sha-9a2d74f53ede1dc5a1c4c785a166bc18e8b47ff4
    container_name: intervai-api
    restart: unless-stopped
    environment:
      - PORT
      - ORIGIN_URL
      - GEMINI_MODEL
      - GEMINI_API_KEY
      - MAX_QUESTIONS
      - MAX_FILE_SIZE
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.intervai-api.rule=Host(`${INTERVAI_HOST}`) && PathPrefix(`/api`)
      - traefik.http.routers.intervai-api.entrypoints=web
      - traefik.http.routers.intervai-api.service=intervai-api
      - traefik.http.services.intervai-api.loadbalancer.server.port=${PORT}

networks:
  proxy:
    external: true
    name: proxy